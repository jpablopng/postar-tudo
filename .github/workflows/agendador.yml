name: Agendador

# Reserva: confere de hora em hora se algum agendado ficou para trás.
# O agendamento normal é feito pelo próprio postar.yml (job "esperar").
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python postador/agendador.py
        env:
          GH_TOKEN: ${{ github.token }}
