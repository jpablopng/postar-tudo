name: Agendador

# Confere a cada 15 minutos se algum vídeo agendado chegou na hora.
# Obs.: o GitHub pode atrasar esse relógio alguns minutos em horário de pico.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python postador/agendador.py
        env:
          GH_TOKEN: ${{ github.token }}
