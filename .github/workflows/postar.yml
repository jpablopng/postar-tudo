name: Postar

# A página cria uma branch fila/<id> com o vídeo e o job.json.
# Post imediato: o push já dispara a postagem.
# Post agendado: a branch fica guardada e o agendador.yml dispara este
# workflow (workflow_dispatch) quando chegar a hora.
on:
  push:
    branches: ["fila/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    name: preparar
    runs-on: ubuntu-latest
    outputs:
      redes: ${{ steps.job.outputs.redes }}
      agora: ${{ steps.job.outputs.agora }}
    steps:
      - uses: actions/checkout@v5
      - id: job
        run: |
          echo "redes=$(jq -c '.redes' fila/job.json)" >> "$GITHUB_OUTPUT"
          AGENDAR=$(jq -r '.agendar // empty' fila/job.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$AGENDAR" ]; then
            echo "agora=true" >> "$GITHUB_OUTPUT"
          else
            echo "agora=false" >> "$GITHUB_OUTPUT"
            echo "Agendado para $AGENDAR. O agendador vai postar na hora." >> "$GITHUB_STEP_SUMMARY"
          fi

  postar:
    needs: ler
    if: needs.ler.outputs.agora == 'true'
    name: ${{ matrix.rede }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rede: ${{ fromJSON(needs.ler.outputs.redes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: postador/requirements.txt
      - run: pip install -r postador/requirements.txt
      - name: Postar no ${{ matrix.rede }}
        run: python postador/postar.py "${{ matrix.rede }}" fila
        env:
          DARKPOST_API_KEY: ${{ secrets.DARKPOST_API_KEY }}
          DARKPOST_ACCOUNT_ID: ${{ vars.DARKPOST_ACCOUNT_ID || (github.repository == 'jpablopng/postar-tudo' && 'cmw8r1b8304bnpd1r2q0jq4yl' || '') }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID || (github.repository == 'jpablopng/postar-tudo' && '17841480314171732' || '') }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}

  limpar:
    needs: [ler, postar]
    if: always() && needs.ler.outputs.agora == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Apagar a branch do vídeo
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
