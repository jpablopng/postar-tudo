name: Postar

# A página (index.html) cria uma branch fila/<id> com o vídeo e o job.json.
# Isso dispara este workflow, que posta nas redes em paralelo e apaga a branch no fim.
on:
  push:
    branches: ["fila/**"]

permissions:
  contents: write

jobs:
  ler:
    name: preparar
    runs-on: ubuntu-latest
    outputs:
      redes: ${{ steps.job.outputs.redes }}
    steps:
      - uses: actions/checkout@v4
      - id: job
        run: echo "redes=$(jq -c '.redes' fila/job.json)" >> "$GITHUB_OUTPUT"

  postar:
    needs: ler
    name: ${{ matrix.rede }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rede: ${{ fromJSON(needs.ler.outputs.redes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: postador/requirements.txt
      - run: pip install -r postador/requirements.txt
      - name: Postar no ${{ matrix.rede }}
        run: python postador/postar.py "${{ matrix.rede }}" fila
        env:
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}

  limpar:
    needs: [ler, postar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Apagar a branch do vídeo
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
